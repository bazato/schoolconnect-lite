# Disposable, synthetic-data-only Render free-tier trial. Never sync this as production.
databases:
  - name: schoolconnect-demo-postgres
    databaseName: schoolconnect_demo
    user: schoolconnect_demo
    postgresMajorVersion: '17'
    plan: free
    region: frankfurt
    ipAllowList: []

services:
  - type: web
    name: schoolconnect-demo-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @schoolconnect/web... && pnpm --filter @schoolconnect/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://schoolconnect-demo-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: schoolconnect-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/start-render-demo.mjs
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolconnect-demo-postgres
          property: connectionString
      - key: RENDER_DEMO_MODE
        value: 'true'
      - key: NODE_ENV
        value: development
      - key: OTP_PROVIDER
        value: development
      - key: DEVELOPMENT_OTP_CODE
        value: '123456'
      - key: AUTHORIZATION_PROVIDER
        value: local-jwt
      - key: RESOURCE_AUTHORIZATION_PROVIDER
        value: policy
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: ENFORCE_HTTPS
        value: 'true'
      - key: CORS_ALLOWED_ORIGINS
        value: https://schoolconnect-demo-admin.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: OUTBOX_POLL_INTERVAL_MS
        value: '2000'
      # Existing Blueprint services must receive sync:false secret values in
      # the Render dashboard; Blueprint sync does not prompt for new secrets.
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT_BASE64
        sync: false
      - key: KAFKA_SSL
        value: 'true'
      - key: KAFKA_SASL_MECHANISM
        value: scram-sha-256
      - key: KAFKA_EVENT_TOPIC
        value: schoolconnect.domain-events.v1
      - key: KAFKA_CREATE_TOPIC
        value: 'false'
      - key: KAFKA_PARTITIONS
        value: '2'
      - key: IDENTITY_DB_POOL_MAX
        value: '2'
      - key: SCHOOL_DB_POOL_MAX
        value: '2'
      - key: CONTENT_DB_POOL_MAX
        value: '2'
      - key: ATTENDANCE_DB_POOL_MAX
        value: '2'
      - key: FILES_DB_POOL_MAX
        value: '2'
      - key: NOTIFICATIONS_DB_POOL_MAX
        value: '2'
      - key: AUDIT_DB_POOL_MAX
        value: '2'
      - key: READ_DB_POOL_MAX
        value: '2'
