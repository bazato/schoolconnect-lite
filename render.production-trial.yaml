# Alternative profile for the EXISTING services, not a second Blueprint to sync alongside render.yaml.
# Preparation only. No paid resources. Mock OTP means synthetic data only, NOT a real-data production launch.
databases:
  - name: schoolconnect-demo-postgres
    databaseName: schoolconnect_demo
    user: schoolconnect_demo
    postgresMajorVersion: '17'
    plan: free
    region: frankfurt
    ipAllowList: []
services:
  - type: web
    name: schoolconnect-demo-admin
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --filter @schoolconnect/web... && pnpm --filter @schoolconnect/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://schoolconnect-demo-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://schoolconnect-demo-api.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
  - type: web
    name: schoolconnect-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: node scripts/managed-runtime.mjs
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RENDER_ROLLBACK_DATABASE_URL
        sync: false
      - key: AUTH_JWT_SECRET
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
      - key: PASSCODE_PEPPER
        sync: false
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_STAGE
        value: trial
      - key: ALLOW_MOCK_OTP
        value: 'true'
      - key: OTP_PROVIDER
        value: development
      - key: DEVELOPMENT_OTP_CODE
        value: '123456'
      - key: RENDER_DEMO_MODE
        value: 'false'
      - key: SC_DEMO_SEED
        value: 'false'
      - key: AUTHORIZATION_PROVIDER
        value: local-jwt
      - key: RESOURCE_AUTHORIZATION_PROVIDER
        value: policy
      - key: AUTH_JWT_ISSUER
        sync: false
      - key: AUTH_JWT_AUDIENCE
        sync: false
      - key: AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: '600'
      - key: ENFORCE_HTTPS
        value: 'true'
      - key: CORS_ALLOWED_ORIGINS
        value: https://schoolconnect-demo-admin.onrender.com
      - key: FILE_STORAGE_PROVIDER
        value: disabled
      - key: FILE_SCANNER_PROVIDER
        value: disabled
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: OUTBOX_POLL_INTERVAL_MS
        value: '2000'
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_CA_CERT_BASE64
        sync: false
      - key: KAFKA_SSL
        value: 'true'
      - key: KAFKA_SASL_MECHANISM
        value: scram-sha-256
      - key: KAFKA_EVENT_TOPIC
        value: schoolconnect.domain-events.v1
      - key: KAFKA_CREATE_TOPIC
        value: 'false'
      - key: KAFKA_PARTITIONS
        value: '2'
      - key: IDENTITY_DB_POOL_MAX
        value: '2'
      - key: SCHOOL_DB_POOL_MAX
        value: '2'
      - key: CONTENT_DB_POOL_MAX
        value: '2'
      - key: ATTENDANCE_DB_POOL_MAX
        value: '2'
      - key: FILES_DB_POOL_MAX
        value: '2'
      - key: NOTIFICATIONS_DB_POOL_MAX
        value: '2'
      - key: AUDIT_DB_POOL_MAX
        value: '2'
      - key: READ_DB_POOL_MAX
        value: '2'
      - key: FEES_DB_POOL_MAX
        value: '2'
      - key: FEES_QUERY_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_FREE_TIER_CONFIRMED
        sync: false
      - key: FEES_AI_MODEL
        sync: false
      - key: FEES_AI_GLOBAL_REQUESTS_PER_MINUTE
        value: '3'
      - key: FEES_AI_DAILY_REQUESTS
        value: '100'
