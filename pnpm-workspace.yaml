packages:
  - apps/*
  - services/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - '@nestjs/common@12.0.3'
  - '@nestjs/core@12.0.3'
  - '@nestjs/platform-express@12.0.3'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - '@nestjs/testing@12.0.3'
