packages:
  - apps/*
  - services/*
  - packages/*

overrides:
  'uuid@<11.1.1': 11.1.1
  'proxy-addr@<2.0.8': 2.0.8
  'shell-quote@<1.11.0': 1.11.0
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'source-map-js@<1.2.2': 1.2.2
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - '@nestjs/common@12.0.3'
  - '@nestjs/core@12.0.3'
  - '@nestjs/platform-express@12.0.3'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - '@nestjs/testing@12.0.3'
  - expo-splash-screen@57.0.10
